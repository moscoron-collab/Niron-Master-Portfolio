name: Fix one Distributions row (Notes / Simon)

on:
  workflow_dispatch:
    inputs:
      match_date: {description: "Date Sent of the row (YYYY-MM-DD)", required: false, default: ""}
      match_llc: {description: "LLC (part of the name, e.g. Dorado)", required: false, default: ""}
      match_amount: {description: "Ron's amount on that row (col C)", required: false, default: ""}
      set_notes: {description: "New Notes text (col E)", required: false, default: ""}
      batch: {description: 'JSON list [{"date","llc","amount","ron","nir","simon","notes"}] (overrides the single-row fields)', required: false, default: ""}
      set_simon: {description: "Simon amount (col F). Blank = leave as is", required: false, default: ""}
      confirm: {description: "Type YES to write. Anything else = dry run.", required: false, default: "NO"}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install google-auth google-auth-httplib2 google-api-python-client
      - name: Fix
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          MATCH_DATE: ${{ github.event.inputs.match_date }}
          MATCH_LLC: ${{ github.event.inputs.match_llc }}
          MATCH_AMOUNT: ${{ github.event.inputs.match_amount }}
          SET_NOTES: ${{ github.event.inputs.set_notes }}
          SET_SIMON: ${{ github.event.inputs.set_simon }}
          BATCH: ${{ github.event.inputs.batch }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: python automation/fix_distribution.py
