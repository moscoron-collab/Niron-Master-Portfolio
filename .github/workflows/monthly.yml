name: Monthly AppFolio Data Pull

on:
  schedule:
    # Runs once daily from the 15th to 25th of each month, in the unified
    # "9 AM Israel time" morning block (user request, Aug 18 2026). All 5 AppFolio
    # pulls run 15 min apart (they share APPFOLIO_COOKIES and must not race):
    # Niron 06:00 UTC = 9:00 Israel (summer) / 8:00 Israel (winter).
    - cron: "0 6 15-25 * *"
  workflow_dispatch:  # allows manual trigger from GitHub UI
    inputs:
      test_alert:
        description: "Only send the 'login failed' alert email (no pull) - to preview it"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright pdfplumber google-auth google-auth-httplib2 google-api-python-client
          playwright install chromium

      - name: Run automation
        id: automation
        if: inputs.test_alert != true
        env:
          APPFOLIO_EMAIL: ${{ secrets.APPFOLIO_EMAIL }}
          APPFOLIO_PASSWORD: ${{ secrets.APPFOLIO_PASSWORD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          APPFOLIO_COOKIES: ${{ secrets.APPFOLIO_COOKIES }}
        # tee keeps the log so the alert step can tell a dead login from other
        # failures. The default shell here is plain `bash -e` (no pipefail), so set
        # it explicitly or tee's exit code would hide run.py's failure.
        run: |
          set -o pipefail
          python automation/run.py 2>&1 | tee run.log

      # Oct 21 2026: Ron asked to be told, from the 15th, what is needed whenever the
      # pull cannot finish on its own. A dead AppFolio login (SMS 2FA) is the usual
      # cause; the email carries the full fix so no Claude session is needed.
      - name: Classify failure
        id: why
        if: always() && (steps.automation.outcome == 'failure' || inputs.test_alert == true)
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ] || grep -q "LOGIN FAILED" run.log 2>/dev/null; then
            echo "kind=login" >> "$GITHUB_OUTPUT"
          else
            echo "kind=other" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert - AppFolio login needed
        if: always() && steps.why.outputs.kind == 'login'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: moscoron@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Niron Automation <moscoron@gmail.com>
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          subject: "AppFolio: צריך התחברות שלך כדי למשוך את החודש"
          body: |
            הרובוט לא מצליח להתחבר ל-AppFolio (פג תוקף ההתחברות, צריך קוד SMS).

            אם עוד לא הגיע מ-Laureate המייל "Monthly Statement" - אין מה לעשות היום, המייל הזה יחזור מחר.
            אם הוא כבר הגיע - 4 צעדים, בערך 3 דקות:

            1. להתחבר ל-AppFolio ולהקליד את קוד ה-SMS:
            https://laureatetld.appfolio.com/oportal/users/log_in

            2. באותה לשונית: תוסף Cookie-Editor, ואז Export, ואז JSON (זה מעתיק את הכל).

            3. לפתוח את הקישור, להדביק בתיבה Value במקום מה שיש שם, וללחוץ Update secret:
            https://github.com/${{ github.repository }}/settings/secrets/actions/APPFOLIO_COOKIES

            4. לפתוח את הקישור, ללחוץ Run workflow ואז את הכפתור הירוק Run workflow:
            https://github.com/${{ github.repository }}/actions/workflows/monthly_all.yml

            בסוף יגיע מייל "Dashboard Updated". אם במקומו מגיע שוב מייל כזה, לפתוח את Claude ולכתוב: המשיכה של AppFolio נכשלה.

            פרטי הריצה: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Alert - pull failed for another reason
        if: always() && steps.why.outputs.kind == 'other'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: moscoron@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Niron Automation <moscoron@gmail.com>
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          subject: "AppFolio: המשיכה נכשלה (לא בגלל ההתחברות)"
          body: |
            ההתחברות ל-AppFolio עבדה, אבל המשיכה לא הצליחה לקרוא את הדוח.
            כנראה AppFolio שינו משהו בדף או בקובץ. זה תיקון קוד.

            לפתוח את Claude ולכתוב: המשיכה של AppFolio נכשלה, והנה הקישור:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send dashboard updated notification
        if: steps.automation.outcome == 'success' && steps.automation.outputs.wrote_data == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: moscoron@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Niron Automation <moscoron@gmail.com>
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          subject: "Niron Master Portfolio — Dashboard Updated"
          body: |
            The monthly AppFolio data pull completed successfully.

            New month data has been written to the History tab of your Google Sheet
            and is now visible on the Niron Master Portfolio dashboard.

            Run details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Save updated cookies
        if: steps.automation.outputs.new_cookies != ''
        continue-on-error: true
        uses: gliech/create-github-secret-action@v1
        with:
          name: APPFOLIO_COOKIES
          value: ${{ steps.automation.outputs.new_cookies }}
          pa_token: ${{ secrets.GITHUB_TOKEN }}
